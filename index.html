<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web TTS Highlighter 🎙️</title>
    <style>
        /* Base / Light Mode Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #333;
            background-color: #fff;
            transition: background-color 0.3s, color 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .controls-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .control-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        button, input[type="file"], select {
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #dark-mode-btn {
            background-color: #333;
            color: #fff;
        }
        #dark-mode-btn:hover { background-color: #555; }

        #text-display {
            white-space: pre-wrap;
            font-size: 1.2rem;
            line-height: 1.6;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            min-height: 300px;
            background: #fff;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .highlight {
            background-color: #ffe066;
            color: black;
            border-radius: 3px;
            padding: 2px 0;
        }

        /* --- Dark Mode Styles --- */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .controls-card {
            background: #1e1e1e;
            border-color: #333;
        }
        body.dark-mode #text-display {
            background: #1e1e1e;
            border-color: #333;
        }
        body.dark-mode .highlight {
            background-color: #b8860b; /* Dark goldenrod for better contrast */
            color: #fff;
        }
        body.dark-mode button:not(#dark-mode-btn) {
            background-color: #0d6efd;
        }
        body.dark-mode button:disabled {
            background-color: #444;
            color: #888;
        }
        body.dark-mode select, body.dark-mode input[type="file"] {
            background-color: #333;
            color: #e0e0e0;
            border-color: #555;
        }
        body.dark-mode #dark-mode-btn {
            background-color: #f8f9fa;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="header-row">
        <h1>Text-to-Speech Highlighter</h1>
        <button id="dark-mode-btn">🌙 Dark Mode</button>
    </div>

    <div class="controls-card">
        <div class="control-row">
            <label><strong>Load .txt File:</strong></label>
            <input type="file" id="file-input" accept=".txt">
        </div>

        <div class="control-row">
            <label><strong>Voice:</strong></label>
            <select id="voice-select" style="flex-grow: 1;"></select>
        </div>

        <div class="control-row">
            <label><strong>Speed:</strong> <span id="speed-val">1.0</span>x</label>
            <input type="range" id="rate-slider" min="0.5" max="2" value="1" step="0.1">

            <label><strong>Volume:</strong> <span id="vol-val">100</span>%</label>
            <input type="range" id="volume-slider" min="0" max="1" value="1" step="0.1">
        </div>

        <div class="control-row">
            <button id="play-btn" disabled>Play from Start</button>
            <button id="pause-btn" disabled>Pause</button>
            <button id="stop-btn" disabled>Stop</button>
        </div>
    </div>

    <div id="text-display">Upload a text file to begin reading...</div>

    <script>
        // DOM Elements
        const fileInput = document.getElementById('file-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');
        const speedVal = document.getElementById('speed-val');
        const volumeSlider = document.getElementById('volume-slider');
        const volVal = document.getElementById('vol-val');
        const playBtn = document.getElementById('play-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const stopBtn = document.getElementById('stop-btn');
        const textDisplay = document.getElementById('text-display');
        const darkModeBtn = document.getElementById('dark-mode-btn');

        // State Variables
        let synth = window.speechSynthesis;
        let voices = [];
        let rawText = "";
        let currentUtterance = null;
        
        let globalOffset = 0;      
        let currentLocalIndex = 0; 
        let isPlaying = false;
        let isPaused = false;
        let isAdjusting = false;   

        // --- Dark Mode Toggle ---
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                darkModeBtn.textContent = '☀️ Light Mode';
            } else {
                darkModeBtn.textContent = '🌙 Dark Mode';
            }
        });

        // --- Voice Loading ---
        function populateVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.value = i;
                voiceSelect.appendChild(option);
            });
        }
        
        populateVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        // --- File Upload ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                stopBtn.click(); // Reset everything
                rawText = e.target.result;
                textDisplay.textContent = rawText;
                playBtn.disabled = false;
                stopBtn.disabled = false;
            };
            reader.readAsText(file);
        });

        rateSlider.addEventListener('input', () => speedVal.textContent = rateSlider.value);
        volumeSlider.addEventListener('input', () => volVal.textContent = Math.round(volumeSlider.value * 100));

        // --- Core Speech Function ---
        function speakFrom(offset) {
            if (synth.speaking) synth.cancel();

            const textChunk = rawText.substring(offset);
            if (textChunk.trim() === '') return;

            currentUtterance = new SpeechSynthesisUtterance(textChunk);
            currentUtterance.voice = voices[voiceSelect.value];
            currentUtterance.rate = parseFloat(rateSlider.value);
            currentUtterance.volume = parseFloat(volumeSlider.value);

            currentUtterance.onboundary = (event) => {
                if (event.name === 'word') {
                    currentLocalIndex = event.charIndex;
                    const absoluteIndex = offset + currentLocalIndex;

                    let nextSpace = rawText.substring(absoluteIndex).search(/\s/);
                    if (nextSpace === -1) nextSpace = rawText.length;
                    else nextSpace += absoluteIndex;

                    const before = rawText.slice(0, absoluteIndex);
                    const word = rawText.slice(absoluteIndex, nextSpace);
                    const after = rawText.slice(nextSpace);

                    textDisplay.innerHTML = before + `<span class="highlight">${word}</span>` + after;
                }
            };

            currentUtterance.onend = () => {
                // Only reset if we finished naturally (not pausing or adjusting sliders)
                if (!isAdjusting && !isPaused) {
                    textDisplay.textContent = rawText;
                    isPlaying = false;
                    globalOffset = 0;
                    currentLocalIndex = 0;
                    pauseBtn.disabled = true;
                    pauseBtn.textContent = "Pause";
                }
            };

            synth.speak(currentUtterance);
            isPlaying = true;
            pauseBtn.disabled = false;
        }

        // --- Button Controls ---
        playBtn.addEventListener('click', () => {
            globalOffset = 0;
            currentLocalIndex = 0;
            isAdjusting = false;
            isPaused = false;
            pauseBtn.textContent = 'Pause';
            speakFrom(0);
        });

        pauseBtn.addEventListener('click', () => {
            if (isPlaying && !isPaused) {
                // We are actively playing, so PAUSE it
                isPaused = true;
                isPlaying = false;
                synth.cancel(); // Stop audio immediately
                globalOffset += currentLocalIndex; // Save our exact spot
                currentLocalIndex = 0;
                pauseBtn.textContent = 'Resume';
            } else if (isPaused) {
                // We are paused, so RESUME it
                isPaused = false;
                pauseBtn.textContent = 'Pause';
                speakFrom(globalOffset);
            }
        });

        stopBtn.addEventListener('click', () => {
            isAdjusting = false;
            isPlaying = false;
            isPaused = false;
            synth.cancel();
            textDisplay.textContent = rawText;
            globalOffset = 0;
            currentLocalIndex = 0;
            pauseBtn.textContent = 'Pause';
            pauseBtn.disabled = true;
        });

        // --- Live Adjustments ---
        function applySettingsLive() {
            if (isPlaying && !isPaused) {
                isAdjusting = true; 
                synth.cancel(); 
                globalOffset += currentLocalIndex; 
                currentLocalIndex = 0;
                
                setTimeout(() => {
                    speakFrom(globalOffset);
                    isAdjusting = false;
                }, 50);
            }
            // If it is paused, we don't need to do anything. The new settings will automatically 
            // apply the next time the user clicks "Resume" and speakFrom() is called.
        }

        rateSlider.addEventListener('change', applySettingsLive);
        volumeSlider.addEventListener('change', applySettingsLive);
        voiceSelect.addEventListener('change', applySettingsLive);
    </script>
</body>
</html>
